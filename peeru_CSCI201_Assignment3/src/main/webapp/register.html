<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Artist Search</title>
<link rel="stylesheet" href="style.css">
<style>
#RegisterButton{
background-color:rgb( 4 , 48 ,124);
color:white;
border-radius:5px;
}
.container{
height:440px;
}
#nameError, #emailError, #passwordError{
color:red;
}
</style>
<script>
document.addEventListener("DOMContentLoaded",function(){
	const paramString=window.location.search;
	const searchP=new URLSearchParams(paramString);
	if(searchP.get('error')==='invalid'){
		document.getElementById('emailError').textContent='User with this email already exists.';
	}
});
document.addEventListener("submit",function(e){
	var emailFormat=/\S+@\S+\.\S+/;
	let name=document.getElementById('fullname');
	let email=document.getElementById('username');
	let password=document.getElementById('password');
	let nameError=document.getElementById('nameError');
	let emailError=document.getElementById('emailError');
	let passwordError=document.getElementById('passwordError');
	name.removeClassList("warningImage");
	email.removeClassList("warningImage");
	password.removeClassList("warningImage"); 
	nameError.textContent='';
	emailError.textContent='';
	passwordError.textContent='';
	name.style.border='2px solid #ccc';
	email.style.border='2px solid #ccc';
	password.style.border='2px solid #ccc';
	let canSubmit=true;
	if(!name.value){
		nameError.textContent='Fullname is required.';
		name.style.borderColor='red';
		name.classList.add("warningImage");
		canSubmit=false;
	}
	
	if(!email.value || !emailFormat.test(email.value)){
		emailError.textContent='Email must be valid.';
		email.style.borderColor='red';
		email.classList.add("warningImage");
		canSubmit=false;
	}
	if(!password.value){
		passwordError.textContent='Password is required';
		password.style.borderColor ='red';
		password.classList.add("warningImage");
		canSubmit=false;
	}
	if(!canSubmit){
		e.preventDefault();
	}
});


</script>
</head>
<body>
<header>
<div class="headTitle">Artist Search</div>
<div class="headerButtons">
<a href="index.html"><button id="searchButton">Search</button></a>
<a href="login.html"><button id="LoginButton">Login</button></a>
<a href="register.html"><button id="RegisterButton">Register</button></a>
</div>
</header>
<div class="container">
<form action="validate2" method="POST" novalidate>

<h1>Register</h1>
<label for="fullname">Fullname</label>
<input type="text" id="fullname" name="fullname" placeholder="John Doe" required>
<p id="nameError"></p>
<label for="username">Email address</label>
<input type="email" id="username" name="username" placeholder="Enter email" required>
<p id="emailError"></p>
<label for="password">Password</label>
<input type="password" id="password" name="password" placeholder="Password" required>
<p id="passwordError"></p>

<input type="submit" id="Register" value="Register">

</form>
</div>
<div class="temp">
<p>Already have an account?<a href="login.html">Login</a></p>
</div>
<footer>
<p>Powered by <img src="images/artsy_logo.svg" alt="logo"><a href="https://www.artsy.net/" target="_blank" style="color:white; text-decoration:none;">Artsy</a></p>
</footer>
</body>
</html>
